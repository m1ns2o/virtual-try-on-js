<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaPipe 가상 의류 착용 시스템</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <!-- 웹캠 비디오 (배경) -->
        <video id="webcam" autoplay playsinline></video>

        <!-- MediaPipe 검출용 캔버스 (숨김) -->
        <canvas id="pose-canvas" style="display: none;"></canvas>

        <!-- Three.js 오버레이 캔버스 (투명) -->
        <canvas id="output-canvas"></canvas>

        <!-- 디버그 캔버스 (스켈레톤 표시용) -->
        <canvas id="debug-canvas"></canvas>

        <!-- UI 컨트롤 -->
        <div class="controls">
            <button id="start-btn" class="btn btn-primary">시작</button>
            <button id="stop-btn" class="btn btn-secondary" disabled>중지</button>
            <label class="checkbox-label">
                <input type="checkbox" id="debug-mode"> 디버그 모드 (스켈레톤 표시)
            </label>
        </div>

        <!-- 정보 패널 -->
        <div class="info-panel">
            <div class="fps-counter">FPS: <span id="fps-value">0</span></div>
            <div class="status">상태: <span id="status-value">대기 중</span></div>
        </div>
    </div>

    <!-- MediaPipe 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <!-- Three.js 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/examples/js/loaders/OBJLoader.js"></script>

    <!-- 애플리케이션 모듈 -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
